<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Page metadata -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bowling Ball Grid Comparison Page</title>
    <!-- Main stylesheet -->
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="../images/bowlIQ-favicon.png">
</head>
<body>
    <!-- Page content wrapper: scales to viewport -->
    <div class="main-content">
        <!-- Site Navigation -->
        <nav class="main-nav">
            <ul>
                <li><a href="homepage.html">Home</a></li>
                <li><a class="active" href="compare.html">Compare</a></li>
                <li><a href="arsenal.html">Arsenal</a></li>
                <li><a href="replacement.html">Replace</a></li>
                <li class="nav-right">
                    <a id="theme-toggle" class="theme-toggle">Dark Mode</a>
                </li>
                <li>
                    <button id="nav-search-btn" class="nav-search-btn" aria-label="Search balls">
                        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor"
                             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
                             aria-hidden="true">
                            <circle cx="8.5" cy="8.5" r="5.5"/>
                            <line x1="13" y1="13" x2="18" y2="18"/>
                        </svg>
                    </button>
                </li>
                <li><button id="login-btn">Login</button></li>
            </ul>
        </nav>

        <header>
            <img id="logo" src="../images/bowl_iq_lightmode.png" alt="Bowl IQ Logo" class="logo">
        </header>

        <!-- Compare page body -->
        <div class="compare-page">

            <!-- Per-slot filter panels: left side applies to Ball 1, right side to Ball 2 -->
            <div class="compare-filter-row">
                <div class="compare-filter-col" id="compare-filter-0"></div>
                <div class="vs-spacer"></div>
                <div class="compare-filter-col" id="compare-filter-1"></div>
            </div>

            <!-- Ball selectors -->
            <div class="compare-selectors">
                <div class="ball-slot">
                    <div class="ball-slot-label">Ball 1</div>
                    <div class="ball-search-wrapper">
                        <input type="text" id="search-0" class="ball-search-input"
                               placeholder="Search by name or brand…" autocomplete="off">
                        <button class="clear-btn" id="clear-0" title="Clear selection">&#x2715;</button>
                        <div class="ball-dropdown" id="dropdown-0"></div>
                    </div>
                </div>

                <div class="vs-divider">VS</div>

                <div class="ball-slot">
                    <div class="ball-slot-label">Ball 2</div>
                    <div class="ball-search-wrapper">
                        <input type="text" id="search-1" class="ball-search-input"
                               placeholder="Search by name or brand…" autocomplete="off">
                        <button class="clear-btn" id="clear-1" title="Clear selection">&#x2715;</button>
                        <div class="ball-dropdown" id="dropdown-1"></div>
                    </div>
                </div>
            </div>

            <!-- Comparison results -->
            <div id="comparison-panel">
                <p class="compare-prompt">Select two bowling balls above to compare them.</p>
            </div>

        </div>

    </div>

    <!-- Footer: copyright and small print (fixed at bottom) -->
    <footer>
        <p>&copy; ECE 50874 Bowling Ball Grid. For Educational Purposes - not a marketed product.</p>
    </footer>
    <script src="../utils/theme.js"></script>
    <script src="../utils/filter-utils.js"></script>
    <script src="../utils/compare.js"></script>
    <script src="../utils/ball-search-modal.js"></script>
    <script src="../utils/auth.js"></script>
</body>
